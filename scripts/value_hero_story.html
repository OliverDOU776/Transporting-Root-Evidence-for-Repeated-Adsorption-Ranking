<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transporting Root Evidence for Repeated Adsorption Ranking</title>
<style>
  body{margin:0;background:#0b1522}
  svg {
    display: block;
    margin: 0 auto;
    font-family: Arial, Helvetica, sans-serif;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* Shared animation baseline: every animated element strictly uses 20s linear 0s infinite */
  .anim {
    animation-duration: 20s;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
    animation-delay: 0s;
  }
  .origin-center {
    transform-box: fill-box;
    transform-origin: center;
  }

  /* ==========================================================================
     CAPTIONS & PROGRESS DOTS (5% per second; strictly non-overlapping)
     Scene 1: 0.0-4.0s (0%-20%)
     Scene 2: 4.0-8.0s (20%-40%)
     Scene 3: 8.0-13.0s (40%-65%)
     Scene 4: 13.0-16.5s (65%-82.5%)
     Scene 5: 16.5-20.0s (82.5%-100%, dissolve to Scene 1 at 98%-100%)
     ========================================================================== */
  @keyframes cap1 {
    0%, 19.0% { opacity: 1; }
    19.4% { opacity: 0.45; }
    19.8%, 99.0% { opacity: 0; }
    99.5% { opacity: 0.5; }
    100% { opacity: 1; }
  }
  @keyframes cap2 {
    0%, 20.0% { opacity: 0; }
    20.5% { opacity: 0.5; }
    21.0%, 39.0% { opacity: 1; }
    39.4% { opacity: 0.45; }
    39.8%, 100% { opacity: 0; }
  }
  @keyframes cap3 {
    0%, 40.0% { opacity: 0; }
    40.5% { opacity: 0.5; }
    41.0%, 64.0% { opacity: 1; }
    64.4% { opacity: 0.45; }
    64.8%, 100% { opacity: 0; }
  }
  @keyframes cap4 {
    0%, 65.0% { opacity: 0; }
    65.5% { opacity: 0.5; }
    66.0%, 81.5% { opacity: 1; }
    81.9% { opacity: 0.45; }
    82.3%, 100% { opacity: 0; }
  }
  @keyframes cap5 {
    0%, 82.5% { opacity: 0; }
    83.0% { opacity: 0.5; }
    83.5%, 98.0% { opacity: 1; }
    98.4% { opacity: 0.45; }
    98.8%, 100% { opacity: 0; }
  }

  .cap-1 { animation-name: cap1; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .cap-2 { animation-name: cap2; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .cap-3 { animation-name: cap3; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .cap-4 { animation-name: cap4; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .cap-5 { animation-name: cap5; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* ==========================================================================
     SCENE 1 & 2: LARGE 3D SODALITE CAGE & MOLECULAR STREAM (0% - 41%)
     ========================================================================== */
  @keyframes leftStageCam {
    0%, 38.5% { opacity: 1; transform: translate(0px, 0px) scale(1); }
    39.8% { opacity: 0.5; transform: translate(-45px, 8px) scale(0.92); }
    41.0%, 98.0% { opacity: 0; transform: translate(-90px, 16px) scale(0.85); }
    99.1% { opacity: 0.55; transform: translate(-35px, 6px) scale(0.94); }
    100% { opacity: 1; transform: translate(0px, 0px) scale(1); }
  }
  .left-stage { animation-name: leftStageCam; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  @keyframes cageBreath {
    0%, 100% { transform: translate(0px, 0px); }
    10% { transform: translate(0px, -4px); }
    20% { transform: translate(0px, 0px); }
    30% { transform: translate(0px, -5px); }
    40% { transform: translate(0px, 0px); }
  }
  .cage-float { animation-name: cageBreath; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* CO2 molecules travel in through a cage window, come to rest INSIDE the cavity
     (3 in Scene 1, not overlapping) and pulse once when they bind */
  @keyframes co2DockA {
    0% { opacity: 0.25; transform: translate(-195px, -38px) rotate(-22deg) scale(1); }
    2.8% { opacity: 0.95; transform: translate(-115px, -22px) rotate(-18deg) scale(1); }
    5.5% { opacity: 1; transform: translate(-38px, -6px) rotate(-15deg) scale(1); }
    7.0% { opacity: 1; transform: translate(0px, 0px) rotate(-14deg) scale(1); }
    7.8% { opacity: 1; transform: translate(0px, 0px) rotate(-14deg) scale(1.22); }
    8.8%, 39.0% { opacity: 1; transform: translate(0px, 0px) rotate(-14deg) scale(1); }
    40.8%, 98.0% { opacity: 0; transform: translate(0px, 0px) rotate(-14deg) scale(1); }
    100% { opacity: 0.25; transform: translate(-195px, -38px) rotate(-22deg) scale(1); }
  }
  @keyframes co2DockB {
    0%, 1.2% { opacity: 0; transform: translate(-245px, -18px) rotate(10deg) scale(1); }
    4.0% { opacity: 0.92; transform: translate(-140px, -10px) rotate(2deg) scale(1); }
    6.8% { opacity: 1; transform: translate(-48px, -4px) rotate(-6deg) scale(1); }
    8.6% { opacity: 1; transform: translate(0px, 0px) rotate(-10deg) scale(1); }
    9.4% { opacity: 1; transform: translate(0px, 0px) rotate(-10deg) scale(1.22); }
    10.4%, 39.0% { opacity: 1; transform: translate(0px, 0px) rotate(-10deg) scale(1); }
    40.8%, 100% { opacity: 0; transform: translate(-245px, -18px) rotate(10deg) scale(1); }
  }
  @keyframes co2DockC {
    0%, 2.5% { opacity: 0; transform: translate(-215px, 24px) rotate(-12deg) scale(1); }
    5.5% { opacity: 0.92; transform: translate(-122px, 14px) rotate(-3deg) scale(1); }
    8.4% { opacity: 1; transform: translate(-42px, 5px) rotate(4deg) scale(1); }
    10.2% { opacity: 1; transform: translate(0px, 0px) rotate(8deg) scale(1); }
    11.0% { opacity: 1; transform: translate(0px, 0px) rotate(8deg) scale(1.22); }
    12.0%, 39.0% { opacity: 1; transform: translate(0px, 0px) rotate(8deg) scale(1); }
    40.8%, 100% { opacity: 0; transform: translate(-215px, 24px) rotate(-12deg) scale(1); }
  }

  /* Scene 2 (higher pressure): two more CO2 arrive through windows, bind inside cavity, and pulse once */
  @keyframes co2HighPressA {
    0%, 22.8% { opacity: 0; transform: translate(-240px, -24px) rotate(-8deg) scale(1); }
    25.2% { opacity: 0.95; transform: translate(-135px, -12px) rotate(4deg) scale(1); }
    27.4% { opacity: 1; transform: translate(-42px, -4px) rotate(12deg) scale(1); }
    28.8% { opacity: 1; transform: translate(0px, 0px) rotate(15deg) scale(1); }
    29.6% { opacity: 1; transform: translate(0px, 0px) rotate(15deg) scale(1.22); }
    30.6%, 39.0% { opacity: 1; transform: translate(0px, 0px) rotate(15deg) scale(1); }
    40.8%, 100% { opacity: 0; transform: translate(-240px, -24px) rotate(-8deg) scale(1); }
  }
  @keyframes co2HighPressB {
    0%, 24.2% { opacity: 0; transform: translate(-195px, 32px) rotate(24deg) scale(1); }
    26.6% { opacity: 0.95; transform: translate(-110px, 18px) rotate(18deg) scale(1); }
    28.8% { opacity: 1; transform: translate(-34px, 6px) rotate(14deg) scale(1); }
    30.2% { opacity: 1; transform: translate(0px, 0px) rotate(12deg) scale(1); }
    31.0% { opacity: 1; transform: translate(0px, 0px) rotate(12deg) scale(1.22); }
    32.0%, 39.0% { opacity: 1; transform: translate(0px, 0px) rotate(12deg) scale(1); }
    40.8%, 100% { opacity: 0; transform: translate(-195px, 32px) rotate(24deg) scale(1); }
  }

  /* One-shot binding pulse glows when each CO2 docks */
  @keyframes bindPulseA {
    0%, 6.6% { opacity: 0; transform: scale(0.5); }
    7.8% { opacity: 0.95; transform: scale(1.35); }
    9.4%, 39.0% { opacity: 0.45; transform: scale(1); }
    40.8%, 100% { opacity: 0; transform: scale(0.5); }
  }
  @keyframes bindPulseB {
    0%, 8.2% { opacity: 0; transform: scale(0.5); }
    9.4% { opacity: 0.95; transform: scale(1.35); }
    11.0%, 39.0% { opacity: 0.45; transform: scale(1); }
    40.8%, 100% { opacity: 0; transform: scale(0.5); }
  }
  @keyframes bindPulseC {
    0%, 9.8% { opacity: 0; transform: scale(0.5); }
    11.0% { opacity: 0.95; transform: scale(1.35); }
    12.6%, 39.0% { opacity: 0.45; transform: scale(1); }
    40.8%, 100% { opacity: 0; transform: scale(0.5); }
  }
  @keyframes bindPulseHPA {
    0%, 28.4% { opacity: 0; transform: scale(0.5); }
    29.6% { opacity: 0.95; transform: scale(1.35); }
    31.2%, 39.0% { opacity: 0.48; transform: scale(1); }
    40.8%, 100% { opacity: 0; transform: scale(0.5); }
  }
  @keyframes bindPulseHPB {
    0%, 29.8% { opacity: 0; transform: scale(0.5); }
    31.0% { opacity: 0.95; transform: scale(1.35); }
    32.6%, 39.0% { opacity: 0.48; transform: scale(1); }
    40.8%, 100% { opacity: 0; transform: scale(0.5); }
  }

  /* N2 molecules approach the cage windows, deflect off the framework, and glide away */
  @keyframes n2DeflectA {
    0% { opacity: 0; transform: translate(-255px, -88px) rotate(14deg); }
    2.4% { opacity: 0.95; transform: translate(-182px, -68px) rotate(12deg); }
    4.6% { opacity: 1; transform: translate(-132px, -54px) rotate(6deg); }
    6.4% { opacity: 1; transform: translate(-102px, -96px) rotate(-28deg); }
    9.8% { opacity: 0.92; transform: translate(8px, -156px) rotate(-22deg); }
    13.5% { opacity: 0.78; transform: translate(135px, -182px) rotate(-16deg); }
    16.2%, 20.5% { opacity: 0; transform: translate(210px, -196px) rotate(-14deg); }
    21.2% { opacity: 0; transform: translate(-255px, -88px) rotate(14deg); }
    23.6% { opacity: 0.95; transform: translate(-182px, -68px) rotate(12deg); }
    25.8% { opacity: 1; transform: translate(-132px, -54px) rotate(6deg); }
    27.6% { opacity: 1; transform: translate(-102px, -96px) rotate(-28deg); }
    31.2% { opacity: 0.92; transform: translate(8px, -156px) rotate(-22deg); }
    35.0% { opacity: 0.78; transform: translate(135px, -182px) rotate(-16deg); }
    38.0%, 100% { opacity: 0; transform: translate(210px, -196px) rotate(-14deg); }
  }
  @keyframes n2DeflectB {
    0%, 1.4% { opacity: 0; transform: translate(-250px, 78px) rotate(-16deg); }
    4.0% { opacity: 0.95; transform: translate(-178px, 56px) rotate(-12deg); }
    6.2% { opacity: 1; transform: translate(-134px, 44px) rotate(-4deg); }
    8.0% { opacity: 1; transform: translate(-96px, 88px) rotate(28deg); }
    11.5% { opacity: 0.92; transform: translate(18px, 148px) rotate(22deg); }
    15.2% { opacity: 0.75; transform: translate(142px, 174px) rotate(16deg); }
    18.0%, 22.0% { opacity: 0; transform: translate(215px, 188px) rotate(14deg); }
    22.8% { opacity: 0; transform: translate(-250px, 78px) rotate(-16deg); }
    25.4% { opacity: 0.95; transform: translate(-178px, 56px) rotate(-12deg); }
    27.6% { opacity: 1; transform: translate(-134px, 44px) rotate(-4deg); }
    29.4% { opacity: 1; transform: translate(-96px, 88px) rotate(28deg); }
    33.0% { opacity: 0.92; transform: translate(18px, 148px) rotate(22deg); }
    36.8% { opacity: 0.75; transform: translate(142px, 174px) rotate(16deg); }
    39.2%, 100% { opacity: 0; transform: translate(215px, 188px) rotate(14deg); }
  }
  @keyframes n2DeflectC {
    0%, 7.5% { opacity: 0; transform: translate(-260px, 8px) rotate(8deg); }
    10.2% { opacity: 0.92; transform: translate(-192px, 2px) rotate(4deg); }
    12.2% { opacity: 1; transform: translate(-156px, -6px) rotate(-18deg); }
    14.5% { opacity: 0.9; transform: translate(-188px, -68px) rotate(-42deg); }
    17.8% { opacity: 0.65; transform: translate(-235px, -138px) rotate(-48deg); }
    19.8%, 27.5% { opacity: 0; transform: translate(-260px, 8px) rotate(8deg); }
    30.2% { opacity: 0.92; transform: translate(-192px, 2px) rotate(4deg); }
    32.2% { opacity: 1; transform: translate(-156px, -6px) rotate(-18deg); }
    34.5% { opacity: 0.9; transform: translate(-188px, -68px) rotate(-42deg); }
    37.8% { opacity: 0.65; transform: translate(-235px, -138px) rotate(-48deg); }
    39.5%, 100% { opacity: 0; transform: translate(-260px, -165px) rotate(-50deg); }
  }

  .co2-a { animation-name: co2DockA; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .co2-b { animation-name: co2DockB; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .co2-c { animation-name: co2DockC; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .co2-hp-a { animation-name: co2HighPressA; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .co2-hp-b { animation-name: co2HighPressB; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .pulse-a { animation-name: bindPulseA; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .pulse-b { animation-name: bindPulseB; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .pulse-c { animation-name: bindPulseC; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .pulse-hp-a { animation-name: bindPulseHPA; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .pulse-hp-b { animation-name: bindPulseHPB; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .n2-a { animation-name: n2DeflectA; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .n2-b { animation-name: n2DeflectB; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .n2-c { animation-name: n2DeflectC; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* ==========================================================================
     HONEYCOMB GALLERY OF 35 SMALL CRYSTALS (Scenes 1, 2, 4, and faint 0.12 in Scene 5)
     ========================================================================== */
  @keyframes galleryCamera {
    0%, 38.5% { opacity: 1; transform: translate(0px, 0px) scale(1); }
    39.8% { opacity: 0.35; transform: translate(-140px, -10px) scale(1.25); }
    41.0%, 64.0% { opacity: 0; transform: translate(-240px, -20px) scale(1.45); }
    65.2% { opacity: 0.65; transform: translate(-266px, 6px) scale(1.05); }
    66.4%, 81.2% { opacity: 1; transform: translate(-266px, 6px) scale(1.05); }
    82.5% { opacity: 0.35; transform: translate(-266px, 6px) scale(1.00); }
    83.6%, 97.6% { opacity: 0.12; transform: translate(-266px, 6px) scale(0.98); }
    98.6% { opacity: 0.35; transform: translate(-120px, 3px) scale(0.99); }
    100% { opacity: 1; transform: translate(0px, 0px) scale(1); }
  }
  .gallery-cam { animation-name: galleryCamera; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* Staggered fade-in of gallery columns in Scene 1 */
  @keyframes galFadeA {
    0%, 1.2% { opacity: 0.38; }
    4.5%, 98.5% { opacity: 1; }
    100% { opacity: 0.38; }
  }
  @keyframes galFadeB {
    0%, 2.2% { opacity: 0.24; }
    6.0%, 98.5% { opacity: 1; }
    100% { opacity: 0.24; }
  }
  @keyframes galFadeC {
    0%, 3.2% { opacity: 0.14; }
    7.5%, 98.5% { opacity: 1; }
    100% { opacity: 0.14; }
  }
  .gal-col-a { animation-name: galFadeA; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .gal-col-b { animation-name: galFadeB; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .gal-col-c { animation-name: galFadeC; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* Scene 1 & Scene 2 gallery header labels (strictly non-overlapping) */
  @keyframes labelPairs {
    0% { opacity: 0.45; }
    3.0%, 18.8% { opacity: 1; }
    19.4% { opacity: 0.4; }
    19.9%, 98.5% { opacity: 0; }
    99.3% { opacity: 0.25; }
    100% { opacity: 0.45; }
  }
  @keyframes labelSolves {
    0%, 24.5% { opacity: 0; }
    25.8% { opacity: 0.5; }
    27.2%, 38.6% { opacity: 1; }
    39.4% { opacity: 0.4; }
    40.0%, 100% { opacity: 0; }
  }
  .lbl-pairs { animation-name: labelPairs; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .lbl-solves { animation-name: labelSolves; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* ==========================================================================
     SCENE 2 & 3: CIRCULAR PRESSURE GAUGE (1.00 -> 1.10 bar)
     Appears at top centre in Scene 2, moves to upper-left in Scene 3
     ========================================================================== */
  @keyframes gaugeGroupMove {
    0%, 19.2% { opacity: 0; transform: translate(535px, 112px) scale(0.92); }
    20.2% { opacity: 0.6; transform: translate(535px, 112px) scale(0.97); }
    21.2%, 38.6% { opacity: 1; transform: translate(535px, 112px) scale(1); }
    40.2% { opacity: 1; transform: translate(355px, 142px) scale(0.99); }
    41.8%, 63.6% { opacity: 1; transform: translate(195px, 172px) scale(0.98); }
    64.6% { opacity: 0.4; transform: translate(195px, 172px) scale(0.92); }
    65.4%, 100% { opacity: 0; transform: translate(535px, 112px) scale(0.92); }
  }
  .pressure-gauge-pos { animation-name: gaugeGroupMove; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* Needle angle: -38deg at 1.00 bar, +28deg at 1.10 bar */
  @keyframes gaugeNeedle {
    0%, 23.4% { transform: rotate(-38deg); }
    24.8% { transform: rotate(-5deg); }
    26.2%, 39.2% { transform: rotate(28deg); }
    40.6%, 46.8% { transform: rotate(-38deg); }
    47.8% { transform: rotate(-5deg); }
    48.6%, 100% { transform: rotate(28deg); }
  }
  .gauge-needle { animation-name: gaugeNeedle; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* Strictly sequential pressure read-outs: 1.00 bar reaches opacity 0 BEFORE 1.10 bar starts */
  @keyframes readout100 {
    0%, 23.6% { opacity: 1; }
    24.1% { opacity: 0.4; }
    24.6%, 40.4% { opacity: 0; }
    41.0%, 46.8% { opacity: 1; }
    47.3% { opacity: 0.4; }
    47.8%, 100% { opacity: 0; }
  }
  @keyframes readout110 {
    0%, 24.9% { opacity: 0; }
    25.4% { opacity: 0.5; }
    26.0%, 39.4% { opacity: 1; }
    40.0%, 48.0% { opacity: 0; }
    48.3% { opacity: 0.5; }
    48.6%, 100% { opacity: 1; }
  }
  .read-100 { animation-name: readout100; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .read-110 { animation-name: readout110; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* Ripple crossing the gallery in Scene 2 (24.2% -> 31.5%) */
  @keyframes pressureRipple {
    0%, 24.2% { opacity: 0; transform: scale(0.15); }
    25.5% { opacity: 0.75; transform: scale(0.45); }
    28.5% { opacity: 0.55; transform: scale(1.15); }
    31.5%, 100% { opacity: 0; transform: scale(1.65); }
  }
  .press-ripple { animation-name: pressureRipple; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* Continuous spin for all solve rings (integer 6 turns = 2160deg over 20s) */
  @keyframes spinRing {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(2160deg); }
  }
  .spin-ring { animation-name: spinRing; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* Scene 2 solve rings appear across gallery columns as ripple passes */
  @keyframes ringWave1 {
    0%, 25.0% { opacity: 0; }
    26.5%, 38.6% { opacity: 0.92; }
    39.8%, 100% { opacity: 0; }
  }
  @keyframes ringWave2 {
    0%, 26.2% { opacity: 0; }
    27.7%, 38.6% { opacity: 0.92; }
    39.8%, 100% { opacity: 0; }
  }
  @keyframes ringWave3 {
    0%, 27.4% { opacity: 0; }
    28.9%, 38.6% { opacity: 0.92; }
    39.8%, 100% { opacity: 0; }
  }
  .ring-w1 { animation-name: ringWave1; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .ring-w2 { animation-name: ringWave2; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .ring-w3 { animation-name: ringWave3; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* ==========================================================================
     SCENE 3: CENTERED LARGE FOCUSED CRYSTAL (184px across, 2 CO2 inside),
     SCORE GAUGE ABOVE, COMPOSITION TRACK BELOW, TAG TO THE RIGHT (40% - 65%)
     ========================================================================== */
  @keyframes scene3Master {
    0%, 39.4% { opacity: 0; }
    40.4% { opacity: 0.5; }
    41.4%, 63.8% { opacity: 1; }
    64.6% { opacity: 0.4; }
    65.4%, 100% { opacity: 0; }
  }
  .scene3-group { animation-name: scene3Master; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* Zoomed crystal pushes in from gallery position to centre (640, 294) */
  @keyframes focusCrystalZoom {
    0%, 38.8% { opacity: 0; transform: translate(845px, 262px) scale(0.28); }
    40.2% { opacity: 0.85; transform: translate(720px, 280px) scale(0.68); }
    41.6%, 63.6% { opacity: 1; transform: translate(640px, 294px) scale(1); }
    64.8% { opacity: 0.45; transform: translate(590px, 268px) scale(0.45); }
    65.6%, 100% { opacity: 0; transform: translate(590px, 268px) scale(0.28); }
  }
  .focus-crystal-pos { animation-name: focusCrystalZoom; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* Active teal cage dims out at 55%-58% as slate cage fades in */
  @keyframes focusTealFade {
    0%, 55.0% { opacity: 1; }
    56.5% { opacity: 0.4; }
    58.0%, 100% { opacity: 0; }
  }
  @keyframes focusSlateFade {
    0%, 55.0% { opacity: 0; }
    56.5% { opacity: 0.6; }
    58.0%, 100% { opacity: 1; }
  }
  @keyframes focusMolDim {
    0%, 55.0% { opacity: 0.95; }
    56.5% { opacity: 0.6; }
    58.0%, 100% { opacity: 0.35; }
  }
  .focus-teal { animation-name: focusTealFade; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .focus-slate { animation-name: focusSlateFade; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .focus-mol { animation-name: focusMolDim; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* Composition track marker at x* = 1/3 (x=540) opening into [4/15, 11/30] (x=500..560).
     Strictly non-overlapping labels: rootLabel100 reaches 0 at 47.8% before bracketLabel110 starts at 48.0% */
  @keyframes rootPointFade {
    0%, 40.5% { opacity: 0; }
    41.8%, 47.0% { opacity: 1; }
    48.0% { opacity: 0.45; }
    49.0%, 100% { opacity: 0.25; }
  }
  @keyframes rootLabel100 {
    0%, 40.5% { opacity: 0; }
    41.8%, 46.8% { opacity: 1; }
    47.3% { opacity: 0.4; }
    47.8%, 100% { opacity: 0; }
  }
  @keyframes bracketExpand {
    0%, 47.4% { opacity: 0; transform: translate(10px, 0px) scaleX(0.08); }
    48.2% { opacity: 0.8; transform: translate(4px, 0px) scaleX(0.65); }
    49.2%, 100% { opacity: 1; transform: translate(0px, 0px) scaleX(1); }
  }
  @keyframes bracketLabel110 {
    0%, 48.0% { opacity: 0; }
    48.3% { opacity: 0.5; }
    48.6%, 100% { opacity: 1; }
  }
  .root-pt { animation-name: rootPointFade; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .lbl-root-100 { animation-name: rootLabel100; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .bracket-band { animation-name: bracketExpand; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .lbl-bracket-110 { animation-name: bracketLabel110; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* Semicircular score gauge: R=120, arc length = pi * 120 = 376.991px.
     34.8% of arc = 131.193px -> stroke-dashoffset from 376.991 down to 245.798 */
  @keyframes scoreArcFill {
    0%, 49.5% { stroke-dashoffset: 376.99; }
    51.5% { stroke-dashoffset: 310.00; }
    53.5% { stroke-dashoffset: 262.00; }
    55.0%, 100% { stroke-dashoffset: 245.80; }
  }
  @keyframes scoreReadoutShow {
    0%, 51.0% { opacity: 0; }
    52.8% { opacity: 0.5; }
    54.5%, 100% { opacity: 1; }
  }
  @keyframes ruledOutTagShow {
    0%, 55.5% { opacity: 0; transform: translate(-12px, 0px); }
    57.0% { opacity: 0.6; transform: translate(-4px, 0px); }
    58.5%, 100% { opacity: 1; transform: translate(0px, 0px); }
  }
  .score-arc-anim { animation-name: scoreArcFill; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .score-read-anim { animation-name: scoreReadoutShow; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .ruled-out-tag { animation-name: ruledOutTagShow; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* ==========================================================================
     SCENE 4: CYAN WAVEFRONT, TRANSIENT BOUND LABEL, SELECTIVE SOLVE & TOP-3 (65% - 82.5%)
     ========================================================================== */
  /* Cyan wavefront sweeps left-to-right across gallery (65.6% -> 70.6%) */
  @keyframes wavefrontSweep {
    0%, 65.4% { opacity: 0; transform: translate(590px, 0px); }
    66.0% { opacity: 0.95; transform: translate(630px, 0px); }
    68.2% { opacity: 1; transform: translate(905px, 0px); }
    70.2% { opacity: 0.9; transform: translate(1185px, 0px); }
    71.0%, 100% { opacity: 0; transform: translate(1235px, 0px); }
  }
  .wavefront-bar { animation-name: wavefrontSweep; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* Short-lived label above gallery after wavefront passes (~1.2s = 6% of 20s: 69.6% -> 75.8%),
     removed BEFORE rank numerals appear at 76.2% */
  @keyframes s4RuledOutBanner {
    0%, 69.2% { opacity: 0; }
    69.8% { opacity: 0.55; }
    70.4%, 75.0% { opacity: 1; }
    75.4% { opacity: 0.45; }
    75.8%, 100% { opacity: 0; }
  }
  .s4-banner-anim { animation-name: s4RuledOutBanner; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* 29 Ruled-out crystals dim to slate as wavefront passes their column (and stay slate through Scene 5 background) */
  @keyframes tealRuleOutC1 {
    0%, 66.2% { opacity: 1; }
    67.2%, 98.0% { opacity: 0; }
    99.2%, 100% { opacity: 1; }
  }
  @keyframes slateRuleOutC1 {
    0%, 66.2% { opacity: 0; }
    67.2%, 98.0% { opacity: 0.78; }
    99.2%, 100% { opacity: 0; }
  }
  @keyframes tealRuleOutC2 {
    0%, 67.4% { opacity: 1; }
    68.4%, 98.0% { opacity: 0; }
    99.2%, 100% { opacity: 1; }
  }
  @keyframes slateRuleOutC2 {
    0%, 67.4% { opacity: 0; }
    68.4%, 98.0% { opacity: 0.78; }
    99.2%, 100% { opacity: 0; }
  }
  @keyframes tealRuleOutC3 {
    0%, 68.6% { opacity: 1; }
    69.6%, 98.0% { opacity: 0; }
    99.2%, 100% { opacity: 1; }
  }
  @keyframes slateRuleOutC3 {
    0%, 68.6% { opacity: 0; }
    69.6%, 98.0% { opacity: 0.78; }
    99.2%, 100% { opacity: 0; }
  }
  @keyframes tealRuleOutC4 {
    0%, 69.6% { opacity: 1; }
    70.6%, 98.0% { opacity: 0; }
    99.2%, 100% { opacity: 1; }
  }
  @keyframes slateRuleOutC4 {
    0%, 69.6% { opacity: 0; }
    70.6%, 98.0% { opacity: 0.78; }
    99.2%, 100% { opacity: 0; }
  }

  .ro-teal-1 { animation-name: tealRuleOutC1; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .ro-slate-1 { animation-name: slateRuleOutC1; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .ro-teal-2 { animation-name: tealRuleOutC2; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .ro-slate-2 { animation-name: slateRuleOutC2; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .ro-teal-3 { animation-name: tealRuleOutC3; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .ro-slate-3 { animation-name: slateRuleOutC3; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .ro-teal-4 { animation-name: tealRuleOutC4; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .ro-slate-4 { animation-name: slateRuleOutC4; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* 6 Undecided crystals get the spinning solve ring in Scene 4 (67.6% -> 75.8%) */
  @keyframes undecidedRing {
    0%, 67.4% { opacity: 0; }
    68.6%, 75.0% { opacity: 1; }
    76.0%, 100% { opacity: 0; }
  }
  .undecided-ring { animation-name: undecidedRing; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* 3 of the 6 undecided crystals dim after being solved (75.4% -> 98.0%) */
  @keyframes solvedLoseTeal {
    0%, 75.2% { opacity: 1; }
    76.4%, 98.0% { opacity: 0; }
    99.2%, 100% { opacity: 1; }
  }
  @keyframes solvedLoseSlate {
    0%, 75.2% { opacity: 0; }
    76.4%, 98.0% { opacity: 0.82; }
    99.2%, 100% { opacity: 0; }
  }
  .lose-teal { animation-name: solvedLoseTeal; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .lose-slate { animation-name: solvedLoseSlate; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* Top 3 crystals rise slightly, turn mint (#7ee2b8) and receive rank numerals 1, 2, 3 after 76.0%
     In Scene 5, the 3 mint winners stay faintly lit in the background gallery, while rank numerals fade out at 82.2% */
  @keyframes winnerLift {
    0%, 75.8% { transform: translate(0px, 0px) scale(1); }
    76.6% { transform: translate(0px, -8px) scale(1.10); }
    77.4%, 82.0% { transform: translate(0px, -15px) scale(1.20); }
    83.4%, 97.6% { transform: translate(0px, -6px) scale(1.12); }
    99.0%, 100% { transform: translate(0px, 0px) scale(1); }
  }
  @keyframes winnerMintShow {
    0%, 75.8% { opacity: 0; }
    76.6% { opacity: 0.6; }
    77.4%, 97.8% { opacity: 1; }
    99.0%, 100% { opacity: 0; }
  }
  @keyframes winnerRankNum {
    0%, 76.0% { opacity: 0; }
    76.7% { opacity: 0.55; }
    77.4%, 81.6% { opacity: 1; }
    82.0% { opacity: 0.4; }
    82.4%, 100% { opacity: 0; }
  }
  .win-lift { animation-name: winnerLift; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .win-mint { animation-name: winnerMintShow; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .win-rank-num { animation-name: winnerRankNum; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  /* ==========================================================================
     SCENE 5: CONCENTRIC STOPWATCH RINGS (82.5% - 100%)
     Outer ring (slate): R=132, C = 2*pi*132 = 829.380px -> full circle (offset 0)
     Inner ring (cyan/mint): R=96, C = 2*pi*96 = 603.186px -> exact half circle (offset 301.593)
     ========================================================================== */
  @keyframes scene5Master {
    0%, 82.0% { opacity: 0; transform: scale(0.94); }
    83.0% { opacity: 0.6; transform: scale(0.98); }
    84.0%, 97.6% { opacity: 1; transform: scale(1); }
    98.6% { opacity: 0.45; transform: scale(0.97); }
    99.4%, 100% { opacity: 0; transform: scale(0.94); }
  }
  .scene5-group { animation-name: scene5Master; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }

  @keyframes outerRingDraw {
    0%, 83.8% { stroke-dashoffset: 829.38; }
    86.5% { stroke-dashoffset: 560.00; }
    89.5% { stroke-dashoffset: 240.00; }
    91.8% { stroke-dashoffset: 45.00; }
    92.8%, 100% { stroke-dashoffset: 0; }
  }
  @keyframes innerRingDraw {
    0%, 83.8% { stroke-dashoffset: 603.19; }
    85.8% { stroke-dashoffset: 465.00; }
    87.6% { stroke-dashoffset: 345.00; }
    88.6%, 100% { stroke-dashoffset: 301.59; }
  }
  @keyframes scene5Labels {
    0%, 84.5% { opacity: 0; }
    86.0% { opacity: 0.6; }
    87.5%, 97.6% { opacity: 1; }
    98.6%, 100% { opacity: 0; }
  }
  .outer-ring-anim { animation-name: outerRingDraw; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .inner-ring-anim { animation-name: innerRingDraw; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
  .s5-lbl-anim { animation-name: scene5Labels; animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: 0s; }
</style>
</head>
<body>
<svg viewBox="0 0 1280 660" width="1280" height="660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ==================== AT MOST 3 SHARED GLOW FILTERS ==================== -->
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cage" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- ==================== STAGE & ATOM GRADIENTS ==================== -->
    <radialGradient id="bg-stage" cx="50%" cy="46%" r="65%" fx="50%" fy="42%">
      <stop offset="0%" stop-color="#14283b" />
      <stop offset="68%" stop-color="#0e1d2d" />
      <stop offset="100%" stop-color="#0b1522" />
    </radialGradient>

    <!-- Glossy Oxygen Sphere (#ff8f7e to #c2473f) -->
    <radialGradient id="grad-oxygen" cx="50%" cy="50%" r="50%" fx="30%" fy="26%">
      <stop offset="0%" stop-color="#ffe5df" />
      <stop offset="26%" stop-color="#ff8f7e" />
      <stop offset="74%" stop-color="#d8564c" />
      <stop offset="100%" stop-color="#a8342d" />
    </radialGradient>

    <!-- Glossy Carbon Sphere (#aeb9c4 to #46525e) -->
    <radialGradient id="grad-carbon" cx="50%" cy="50%" r="50%" fx="30%" fy="26%">
      <stop offset="0%" stop-color="#f0f5f9" />
      <stop offset="28%" stop-color="#aeb9c4" />
      <stop offset="75%" stop-color="#5d6b79" />
      <stop offset="100%" stop-color="#38434e" />
    </radialGradient>

    <!-- Glossy Nitrogen Sphere (#8cc2ff to #2f6fb5) -->
    <radialGradient id="grad-nitrogen" cx="50%" cy="50%" r="50%" fx="30%" fy="26%">
      <stop offset="0%" stop-color="#e8f4ff" />
      <stop offset="26%" stop-color="#8cc2ff" />
      <stop offset="74%" stop-color="#407ec7" />
      <stop offset="100%" stop-color="#225794" />
    </radialGradient>

    <!-- Glossy Pale Teal-Silver Framework Node (#d9f3ee to #4f9c93) -->
    <radialGradient id="grad-fw-node" cx="50%" cy="50%" r="50%" fx="30%" fy="26%">
      <stop offset="0%" stop-color="#f5fffe" />
      <stop offset="28%" stop-color="#d9f3ee" />
      <stop offset="74%" stop-color="#6eb9b0" />
      <stop offset="100%" stop-color="#3c8279" />
    </radialGradient>

    <!-- Variant B Framework Node: Cool Cyan-Aqua -->
    <radialGradient id="grad-aqua-node" cx="50%" cy="50%" r="50%" fx="30%" fy="26%">
      <stop offset="0%" stop-color="#f2fbff" />
      <stop offset="28%" stop-color="#c9eefc" />
      <stop offset="74%" stop-color="#58b0d6" />
      <stop offset="100%" stop-color="#327596" />
    </radialGradient>

    <!-- Variant C Framework Node: Seafoam-Jade -->
    <radialGradient id="grad-sea-node" cx="50%" cy="50%" r="50%" fx="30%" fy="26%">
      <stop offset="0%" stop-color="#f3fff7" />
      <stop offset="28%" stop-color="#d2f5e0" />
      <stop offset="74%" stop-color="#64b88e" />
      <stop offset="100%" stop-color="#397d5c" />
    </radialGradient>

    <!-- Muted Slate Node (#5a6b7c) -->
    <radialGradient id="grad-slate-node" cx="50%" cy="50%" r="50%" fx="35%" fy="30%">
      <stop offset="0%" stop-color="#8fa1b3" />
      <stop offset="45%" stop-color="#5a6b7c" />
      <stop offset="100%" stop-color="#374452" />
    </radialGradient>

    <!-- Mint Node (#7ee2b8) -->
    <radialGradient id="grad-mint-node" cx="50%" cy="50%" r="50%" fx="32%" fy="28%">
      <stop offset="0%" stop-color="#eafff5" />
      <stop offset="32%" stop-color="#7ee2b8" />
      <stop offset="100%" stop-color="#2d946c" />
    </radialGradient>

    <!-- 3D Inner Cavity Volumetric Cyan Glow -->
    <radialGradient id="grad-cavity-vol" cx="48%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#5fd4e6" stop-opacity="0.28" />
      <stop offset="38%" stop-color="#215564" stop-opacity="0.46" />
      <stop offset="72%" stop-color="#091724" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#4f9c93" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="grad-cavity" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d4d59" stop-opacity="0.55" />
      <stop offset="62%" stop-color="#07121c" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#4f9c93" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Halos -->
    <radialGradient id="halo-teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5fd4e6" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#4f9c93" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#4f9c93" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="halo-aqua" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#68d8ff" stop-opacity="0.46" />
      <stop offset="55%" stop-color="#3c8db8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3c8db8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="halo-sea" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ce6b2" stop-opacity="0.44" />
      <stop offset="55%" stop-color="#479972" stop-opacity="0.17" />
      <stop offset="100%" stop-color="#479972" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="halo-coral" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8f7e" stop-opacity="0.62" />
      <stop offset="52%" stop-color="#5fd4e6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#5fd4e6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="halo-azure" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8cc2ff" stop-opacity="0.52" />
      <stop offset="55%" stop-color="#2f6fb5" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#2f6fb5" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="halo-mint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ee2b8" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#5fd4e6" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#7ee2b8" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="wave-veil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5fd4e6" stop-opacity="0" />
      <stop offset="70%" stop-color="#5fd4e6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#5fd4e6" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="grad-transport-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fd4e6" />
      <stop offset="100%" stop-color="#7ee2b8" />
    </linearGradient>

    <!-- Faint Hexagonal Lattice Pattern (opacity ~0.06) -->
    <pattern id="hex-lattice" width="52" height="90" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 52 15 L 52 45 L 26 60 L 0 45 L 0 15 Z M 26 60 L 26 90 M 0 45 L -26 60 M 52 45 L 78 60"
            fill="none" stroke="#6fb7ad" stroke-width="1" stroke-opacity="0.06" />
    </pattern>

    <!-- ==================== REUSABLE SHAPES (PLAIN <g id="..."> AROUND ORIGIN) ==================== -->
    <!-- Enlarged (~2.2x) Straight O=C=O CO2 molecule (~88px across) with glossy shaded atoms, visible double bonds & soft glow -->
    <g id="mol-co2">
      <ellipse cx="0" cy="0" rx="50" ry="22" fill="url(#halo-coral)" opacity="0.45" />
      <!-- Visible double bond cylinders between Left O (-29) and C (0), and between C (0) and Right O (+29) -->
      <line x1="-26" y1="-4.6" x2="-6" y2="-4.6" stroke="#b8c9d6" stroke-width="3.6" stroke-linecap="round" />
      <line x1="-26" y1="-4.6" x2="-6" y2="-4.6" stroke="#f0f7fc" stroke-width="1.4" stroke-linecap="round" />
      <line x1="-26" y1="4.6" x2="-6" y2="4.6" stroke="#b8c9d6" stroke-width="3.6" stroke-linecap="round" />
      <line x1="-26" y1="4.6" x2="-6" y2="4.6" stroke="#f0f7fc" stroke-width="1.4" stroke-linecap="round" />
